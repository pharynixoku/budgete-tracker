<body>
    <!--main-heading-->
<header>
    <h1 id="main-heading">MY BUDGET TRUCKER</h1>
    <p class="subtitle"> Trac your income and expenses in one place.</p>
</header>
<main>

<section class="expense-section">

    <div class="input-container"><br>
        <label for="expense-name">Expense name</label><br>
        <input type="text" id="expense" placeholder="Enter expense name"><br>
    </div>

    <div class="input-container"><br>
        <label for="amount">amount</label><br>
        <input type="number" id="amount" placeholder="Enter amount"><br>

    </div>

<div class="input-container"><br>
    <label for="category">category</label><br>
    <input type="text" id="category" placeholder="Enter category"> <br>

</div>

</section>
<!--your expenses section-->
<section class="expense list">
    <h2>your Expenses</h2>
        <p id="no expenses">no expenses yet.</p>



</section>
</main>
